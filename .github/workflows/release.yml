name: Release Acadrix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.4.0-rc.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package & Release Chrome Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

      - name: Build Extension & Bookmarklet Artifacts
        run: npm run build

      - name: Verify Code Syntax
        run: npm run check

      - name: Check Bookmarklet Consistency
        run: git diff --exit-code -- bookmarklet/bookmarklet.txt bookmarklet/install.html

      - name: Run Full Test Suite
        run: npm test

      - name: Determine Version & Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $TAG (Version: $VERSION)"

      - name: Prepare release notes from CHANGELOG.md
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const version = process.env.RELEASE_VERSION;
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex((line) => line.startsWith(`## [${version}]`));
          if (start < 0) throw new Error(`CHANGELOG.md has no section for ${version}`);
          const next = lines.findIndex((line, index) => index > start && line.startsWith('## ['));
          const end = next < 0 ? lines.length : next;
          writeFileSync('release-notes.md', `${lines.slice(start, end).join('\n').trim()}\n`);
          NODE

      - name: Package Release Archives
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          # 1. Package Chrome Extension Bundle
          cd build && zip -r -FS "../acadrix-v${VERSION}-chrome-extension.zip" . -x '*.DS_Store' && cd ..
          # 2. Package Bookmarklet Distribution
          cd bookmarklet && zip -r -FS "../acadrix-v${VERSION}-bookmarklet.zip" . -x '*.DS_Store' && cd ..
          ls -la acadrix-*.zip

      - name: Upload Build Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: acadrix-release-packages
          path: acadrix-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Acadrix ${{ steps.vars.outputs.tag }}
          files: acadrix-*.zip
          generate_release_notes: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || contains(steps.vars.outputs.tag, '-') }}
          body_path: release-notes.md
