name: CI Verification

on:
  push:
    branches: [main, modular-architecture]
  pull_request:
    branches: [main, modular-architecture]

jobs:
  validate:
    name: Build, Lint & Test Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

      - name: Build & Assemble Targets
        run: npm run build

      - name: Verify Code Syntax
        run: npm run check

      - name: Check Bookmarklet Consistency
        run: git diff --exit-code -- bookmarklet/bookmarklet.txt bookmarklet/install.html

      - name: Run Test Suite
        run: npm test

      - name: Zip Chrome Extension Bundle
        run: cd build && zip -r -FS ../acadrix-chrome-extension.zip . -x '*.DS_Store'

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acadrix-chrome-extension
          path: acadrix-chrome-extension.zip
