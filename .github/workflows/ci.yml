name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate extension manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('extension/manifest.json', 'utf8'))"

      - name: Build extension and bookmarklet
        run: npm run build

      - name: Check generated JavaScript syntax
        run: npm run check

      - name: Check generated bookmarklet files are current
        run: git diff --exit-code -- bookmarklet/bookmarklet.txt bookmarklet/install.html

      - name: Run deterministic test suite
        run: npm test

      - name: Package extension artifact
        run: cd build && zip -r -FS ../acadrix-chrome-extension.zip . -x '*.DS_Store'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: acadrix-chrome-extension
          path: acadrix-chrome-extension.zip
          if-no-files-found: error
