<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IITM Assessment — MCQ Basic Fixture</title>
</head>
<body>
  <app-assessment-question-view>
    <div class="header">
      <span class="question-header">Question 1 / 3</span>
      <span class="question-marks">1 Mark</span>
      <app-submission-timer>45:20</app-submission-timer>
    </div>

    <div class="chips assessment-paginator">
      <button class="chip active">1</button>
      <button class="chip">2</button>
      <button class="chip">3</button>
    </div>

    <div class="question-body">
      <div class="backend-html">
        <p>Which of the following is an immutable data type in Python?</p>
      </div>

      <app-assessment-question>
        <fieldset class="mcq">
          <legend class="choices-legend">Which of the following is an immutable data type in Python?</legend>
          <div class="choices" role="radiogroup">
            <label class="choice" role="radio" tabindex="0">
              <span class="choice-letter">A</span>
              <span class="choice-text">List</span>
            </label>
            <label class="choice" role="radio" tabindex="0">
              <span class="choice-letter">B</span>
              <span class="choice-text">Tuple</span>
            </label>
            <label class="choice" role="radio" tabindex="0">
              <span class="choice-letter">C</span>
              <span class="choice-text">Dictionary</span>
            </label>
            <label class="choice" role="radio" tabindex="0">
              <span class="choice-letter">D</span>
              <span class="choice-text">Set</span>
            </label>
          </div>
        </fieldset>
      </app-assessment-question>
    </div>
  </app-assessment-question-view>
</body>
</html>
