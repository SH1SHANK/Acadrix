<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IITM Assessment — MCQ With Math (KaTeX) Fixture</title>
</head>
<body>
  <app-assessment-question-view>
    <div class="header">
      <span class="question-header">Question 2 / 3</span>
      <span class="question-marks">2 Marks</span>
      <app-submission-timer>44:10</app-submission-timer>
    </div>

    <div class="chips assessment-paginator">
      <button class="chip">1</button>
      <button class="chip active">2</button>
      <button class="chip">3</button>
    </div>

    <div class="question-body">
      <div class="backend-html">
        <p>Let <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi><mo>∈</mo><msup><mi mathvariant="double-struck">R</mi><mrow><mi>n</mi><mo>×</mo><mi>n</mi></mrow></msup></mrow><annotation encoding="application/x-tex">A \in \mathbb{R}^{n \times n}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.72em;"></span><span class="mord mathnormal">A</span><span class="mspace" style="margin-right:0.27em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.27em;"></span></span><span class="base"><span class="strut" style="height:0.77em;"></span><span class="mord"><span class="mord mathbb">R</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.77em;"><span style="top:-3.06em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span><span class="mbin mtight">×</span><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span></span> be a real symmetric matrix.</p>
        <p>Which of the following statements is true regarding the eigenvalues of <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.68em;"></span><span class="mord mathnormal">A</span></span></span></span>?</p>
      </div>

      <app-assessment-question>
        <fieldset class="mcq">
          <div class="choices" role="radiogroup">
            <label class="choice" role="radio">
              <span class="choice-letter">A</span>
              <span class="choice-text">All eigenvalues are strictly positive.</span>
            </label>
            <label class="choice" role="radio">
              <span class="choice-letter">B</span>
              <span class="choice-text">All eigenvalues are real.</span>
            </label>
            <label class="choice" role="radio">
              <span class="choice-letter">C</span>
              <span class="choice-text">All eigenvalues are complex conjugates.</span>
            </label>
          </div>
        </fieldset>
      </app-assessment-question>
    </div>
  </app-assessment-question-view>
</body>
</html>
