<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IITM Assessment — Review Mode Fixture</title>
</head>
<body>
  <app-assessment-question-view>
    <div class="header">
      <span class="question-header">Question 1 / 1</span>
      <span class="question-marks">Score: 1 / 1</span>
    </div>

    <div class="chips assessment-paginator">
      <button class="chip active">1</button>
    </div>

    <div class="question-body">
      <div class="backend-html">
        <p>What is the time complexity of binary search on a sorted array of size <em>n</em>?</p>
      </div>

      <div class="evaluated-answer">
        <div class="header">
          <span class="status correct">Answer is Correct</span>
          <span class="score">Score: 1</span>
        </div>

        <app-assessment-question>
          <fieldset class="mcq">
            <div class="choices" role="radiogroup">
              <label class="choice selected" role="radio">
                <span class="choice-letter">A</span>
                <span class="choice-text">O(log n)</span>
              </label>
              <label class="choice" role="radio">
                <span class="choice-letter">B</span>
                <span class="choice-text">O(n)</span>
              </label>
              <label class="choice" role="radio">
                <span class="choice-letter">C</span>
                <span class="choice-text">O(n log n)</span>
              </label>
            </div>
          </fieldset>
        </app-assessment-question>

        <div class="feedback">
          <div class="title">Feedback</div>
          <div class="body">Binary search halves the search space in every iteration, resulting in O(log n) time complexity.</div>
        </div>
      </div>
    </div>
  </app-assessment-question-view>
</body>
</html>
