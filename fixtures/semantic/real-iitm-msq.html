<app-assessment-question-view>
  <div class="header">
    <span class="question-header">Question 2 / 2</span>
    <span class="question-marks">3 Marks</span>
  </div>

  <div class="chips assessment-paginator">
    <button class="chip">1</button>
    <button class="chip active">2</button>
  </div>

  <div class="question-body">
    <div class="backend-html">
      <p>Which of the following data structures guarantee <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>log</mi><mo>⁡</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\log n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true">O(log n)</span></span> worst-case search time?</p>
    </div>

    <app-assessment-question>
      <div class="choices">
        <button class="choice" role="checkbox" aria-checked="true" id="opt-msq-1">
          <span class="choice-indicator"><span class="checkbox-box"></span></span>
          <span class="choice-letter">A.</span>
          <span class="choice-text backend-html">Red-Black Tree</span>
        </button>

        <button class="choice" role="checkbox" aria-checked="false" id="opt-msq-2">
          <span class="choice-indicator"><span class="checkbox-box"></span></span>
          <span class="choice-letter">B.</span>
          <span class="choice-text backend-html">Unbalanced Binary Search Tree</span>
        </button>

        <button class="choice" role="checkbox" aria-checked="true" id="opt-msq-3">
          <span class="choice-indicator"><span class="checkbox-box"></span></span>
          <span class="choice-letter">C.</span>
          <span class="choice-text backend-html">AVL Tree</span>
        </button>

        <button class="choice" role="checkbox" aria-checked="false" id="opt-msq-4">
          <span class="choice-indicator"><span class="checkbox-box"></span></span>
          <span class="choice-letter">D.</span>
          <span class="choice-text backend-html">Singly Linked List</span>
        </button>

        <button class="clear-selection" type="button">Clear Selection</button>
      </div>
    </app-assessment-question>
  </div>
</app-assessment-question-view>
