<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1013" />
      <stop offset="100%" stop-color="#14181F" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#2A2F37" fill-opacity="0.6"/>
    </pattern>
    <linearGradient id="accent-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70C08E" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#70C08E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#70C08E" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas & Border -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" stroke="#262A33" stroke-width="1"/>
  <line x1="120" y1="0" x2="1080" y2="0" stroke="url(#accent-stroke)" stroke-width="2"/>

  <!-- Technical Corner Hairlines -->
  <path d="M 24 36 L 24 24 L 36 24" stroke="#3A404A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 1176 36 L 1176 24 L 1164 24" stroke="#3A404A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 24 304 L 24 316 L 36 316" stroke="#3A404A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 1176 304 L 1176 316 L 1164 316" stroke="#3A404A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Brand Mark Icon Box (Centered) -->
  <g transform="translate(560, 48)">
    <rect width="80" height="80" rx="20" fill="#121B1B"/>
    <rect x="1" y="1" width="78" height="78" rx="19" stroke="#70C08E" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M24 10 H65 L53 31 H71 L47 70 H40 V54 H18 L30 33 H9 L24 10 Z" fill="#70C08E"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="180" text-anchor="middle" font-family="Outfit, Satoshi, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="46" font-weight="600" fill="#FFFFFF" letter-spacing="-0.03em">Acadrix</text>
  <circle cx="698" cy="150" r="4.5" fill="#70C08E"/>

  <!-- Subtitle -->
  <text x="600" y="214" text-anchor="middle" font-family="Satoshi, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#A3A8B2" letter-spacing="-0.01em">
    Intelligent Tooling &amp; Assessment Architecture for the IIT Madras Online Degree Portal
  </text>

  <!-- Capability Badges/Pills Row -->
  <g transform="translate(600, 266)">
    <!-- Pill 1: Assessment Reader -->
    <g transform="translate(-360, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#1C2026" stroke="#2E3440" stroke-width="1"/>
      <circle cx="-62" cy="0" r="3" fill="#70C08E"/>
      <text x="-50" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#ECEDEF">Unified Reader</text>
    </g>

    <!-- Pill 2: Programming Assignments -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#1C2026" stroke="#2E3440" stroke-width="1"/>
      <circle cx="-77" cy="0" r="3" fill="#70C08E"/>
      <text x="-65" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#ECEDEF">Programming Labs</text>
    </g>

    <!-- Pill 3: AI Review Bridge -->
    <g transform="translate(120, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#1C2026" stroke="#2E3440" stroke-width="1"/>
      <circle cx="-77" cy="0" r="3" fill="#70C08E"/>
      <text x="-65" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#ECEDEF">AI Review Bridge</text>
    </g>

    <!-- Pill 4: Multi-Format Exporter -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1C2026" stroke="#2E3440" stroke-width="1"/>
      <circle cx="-67" cy="0" r="3" fill="#70C08E"/>
      <text x="-55" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#ECEDEF">Vector Exporters</text>
    </g>
  </g>
</svg>
