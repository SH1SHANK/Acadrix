<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Unfold IITM</title>
<style>
  :root {
    color-scheme: light;

    /* ── 1. Brand Tokens ─────────────────────────────────────────────────── */
    --acx-brand-accent-500: #2F4BDB;
    --acx-brand-accent-600: #2540C2;
    --acx-brand-accent-700: #1D33A3;
    --acx-brand-accent-300: #8EA2FF;
    --acx-brand-accent-200: #A9B8FF;
    --acx-brand-accent-400: #7089F5;

    --acx-brand-paper-0:   #FFFFFF;
    --acx-brand-paper-50:  #FAFAF8;
    --acx-brand-paper-100: #F3F3F0;
    --acx-brand-paper-200: #E4E4DF;
    --acx-brand-paper-300: #CFCFC8;
    --acx-brand-ink-900:   #16181D;
    --acx-brand-ink-600:   #5B606B;
    --acx-brand-ink-500:   #6B707B;

    --acx-brand-night-950: #0E1013;
    --acx-brand-night-900: #15181D;
    --acx-brand-night-800: #1C2026;
    --acx-brand-night-700: #2A2F37;
    --acx-brand-night-600: #3A404A;
    --acx-brand-fog-100:   #ECEDEF;
    --acx-brand-fog-300:   #A3A8B2;
    --acx-brand-fog-400:   #868B95;

    --acx-brand-accent-subtle-light: rgb(47 75 219 / 0.08);
    --acx-brand-accent-subtle-dark:  rgb(142 162 255 / 0.14);

    /* ── 2. Semantic UI Tokens (Light Default) ───────────────────────────── */
    --acx-bg:             var(--acx-brand-paper-50);
    --acx-surface:        var(--acx-brand-paper-0);
    --acx-surface-raised: var(--acx-brand-paper-0);
    --acx-surface-sunken: var(--acx-brand-paper-100);
    --acx-text:           var(--acx-brand-ink-900);
    --acx-text-muted:     var(--acx-brand-ink-600);
    --acx-text-subtle:    var(--acx-brand-ink-500);
    --acx-text-on-accent: var(--acx-brand-paper-0);
    --acx-text-disabled:  var(--acx-brand-paper-300);
    --acx-border:         var(--acx-brand-paper-200);
    --acx-border-strong:  var(--acx-brand-paper-300);
    --acx-accent:         var(--acx-brand-accent-500);
    --acx-accent-hover:   var(--acx-brand-accent-600);
    --acx-accent-active:  var(--acx-brand-accent-700);
    --acx-accent-subtle:  var(--acx-brand-accent-subtle-light);
    --acx-focus-ring:     var(--acx-brand-accent-500);

    /* ── 3. Typography & Scale Tokens ────────────────────────────────────── */
    --acx-font-ui:      "Satoshi Variable", "Satoshi", system-ui, -apple-system, "Segoe UI", sans-serif;
    --acx-font-display: "Outfit", "Satoshi Variable", system-ui, sans-serif;
    --acx-font-mono:    "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --acx-text-wordmark:     600 18px/24px var(--acx-font-display);
    --acx-text-ui:           500 14px/20px var(--acx-font-ui);
    --acx-text-ui-regular:   400 14px/20px var(--acx-font-ui);
    --acx-text-small:        400 13px/18px var(--acx-font-ui);
    --acx-text-caption:      500 12px/16px var(--acx-font-ui);
    --acx-text-mono:         400 13px/20px var(--acx-font-mono);
    --acx-text-mono-caption: 500 12px/16px var(--acx-font-mono);

    --acx-tracking-tight:    -0.01em;
    --acx-tracking-overline: 0.04em;

    --acx-space-0: 0px;
    --acx-space-1: 4px;
    --acx-space-2: 8px;
    --acx-space-3: 12px;
    --acx-space-4: 16px;
    --acx-space-5: 20px;
    --acx-space-6: 24px;

    --acx-radius-sm:   4px;
    --acx-radius-md:   8px;
    --acx-radius-lg:   12px;
    --acx-radius-full: 999px;

    --acx-border-width:        1px;
    --acx-border-width-strong: 2px;
    --acx-focus-offset:        2px;

    --acx-duration-fast: 120ms;
    --acx-duration-base: 200ms;
    --acx-ease-standard: cubic-bezier(0.2, 0, 0, 1);

    --acx-shadow-1: 0 1px 2px rgb(22 24 29 / 0.06);
    --acx-shadow-2: 0 4px 12px rgb(22 24 29 / 0.10);
    --acx-shadow-3: 0 12px 32px rgb(22 24 29 / 0.16), 0 2px 6px rgb(22 24 29 / 0.08);

    --acx-control-h-sm: 28px;
    --acx-control-h-md: 36px;
    --acx-popup-w:      360px;
    --acx-switch-w:     44px;
    --acx-switch-h:     24px;
    --acx-switch-thumb: 16px;
    --acx-switch-shift: 20px;
    --acx-input-max-w:  148px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --acx-bg:             var(--acx-brand-night-950);
      --acx-surface:        var(--acx-brand-night-900);
      --acx-surface-raised: var(--acx-brand-night-800);
      --acx-surface-sunken: var(--acx-brand-night-950);
      --acx-text:           var(--acx-brand-fog-100);
      --acx-text-muted:     var(--acx-brand-fog-300);
      --acx-text-subtle:    var(--acx-brand-fog-400);
      --acx-text-on-accent: var(--acx-brand-night-950);
      --acx-text-disabled:  var(--acx-brand-night-600);
      --acx-border:         var(--acx-brand-night-700);
      --acx-border-strong:  var(--acx-brand-night-600);
      --acx-accent:         var(--acx-brand-accent-300);
      --acx-accent-hover:   var(--acx-brand-accent-200);
      --acx-accent-active:  var(--acx-brand-accent-400);
      --acx-accent-subtle:  var(--acx-brand-accent-subtle-dark);
      --acx-focus-ring:     var(--acx-brand-accent-300);
      --acx-shadow-1:       0 1px 2px rgb(0 0 0 / 0.15);
      --acx-shadow-2:       0 4px 12px rgb(0 0 0 / 0.25);
      --acx-shadow-3:       0 12px 32px rgb(0 0 0 / 0.40), 0 2px 6px rgb(0 0 0 / 0.20);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --acx-bg:             var(--acx-brand-night-950);
    --acx-surface:        var(--acx-brand-night-900);
    --acx-surface-raised: var(--acx-brand-night-800);
    --acx-surface-sunken: var(--acx-brand-night-950);
    --acx-text:           var(--acx-brand-fog-100);
    --acx-text-muted:     var(--acx-brand-fog-300);
    --acx-text-subtle:    var(--acx-brand-fog-400);
    --acx-text-on-accent: var(--acx-brand-night-950);
    --acx-text-disabled:  var(--acx-brand-night-600);
    --acx-border:         var(--acx-brand-night-700);
    --acx-border-strong:  var(--acx-brand-night-600);
    --acx-accent:         var(--acx-brand-accent-300);
    --acx-accent-hover:   var(--acx-brand-accent-200);
    --acx-accent-active:  var(--acx-brand-accent-400);
    --acx-accent-subtle:  var(--acx-brand-accent-subtle-dark);
    --acx-focus-ring:     var(--acx-brand-accent-300);
    --acx-shadow-1:       0 1px 2px rgb(0 0 0 / 0.15);
    --acx-shadow-2:       0 4px 12px rgb(0 0 0 / 0.25);
    --acx-shadow-3:       0 12px 32px rgb(0 0 0 / 0.40), 0 2px 6px rgb(0 0 0 / 0.20);
  }

  * {
    box-sizing: border-box;
  }

  body {
    width: var(--acx-popup-w);
    margin: var(--acx-space-0);
    padding: var(--acx-space-4);
    font: var(--acx-text-small);
    color: var(--acx-text);
    background: var(--acx-bg);
  }

  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--acx-space-2);
    margin: var(--acx-space-0) var(--acx-space-0) var(--acx-space-3);
    padding-bottom: var(--acx-space-3);
    border-bottom: var(--acx-border-width) solid var(--acx-border);
  }
  .head .brand {
    display: flex;
    align-items: center;
    gap: var(--acx-space-2);
    min-width: var(--acx-space-0);
  }
  .head .brand-icon {
    width: 20px;
    height: 20px;
    color: var(--acx-accent);
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .head .brand-text {
    display: flex;
    align-items: baseline;
    gap: var(--acx-space-2);
  }
  .head .name {
    font: var(--acx-text-wordmark);
    letter-spacing: var(--acx-tracking-tight);
    color: var(--acx-text);
  }
  .head .subtitle {
    color: var(--acx-text-muted);
    font: var(--acx-text-caption);
  }
  .head-actions {
    position: relative;
    display: flex;
    align-items: center;
  }
  .head-menu-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--acx-control-h-sm);
    height: var(--acx-control-h-sm);
    border: var(--acx-border-width) solid transparent;
    border-radius: var(--acx-radius-md);
    padding: var(--acx-space-0);
    cursor: pointer;
    color: var(--acx-text-muted);
    background: transparent;
    transition:
      color var(--acx-duration-fast) var(--acx-ease-standard),
      background-color var(--acx-duration-fast) var(--acx-ease-standard),
      border-color var(--acx-duration-fast) var(--acx-ease-standard);
  }
  .head-menu-toggle svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
    flex: none;
  }
  .head-menu-toggle:hover,
  .head-menu-toggle[aria-expanded="true"] {
    color: var(--acx-text);
    background: var(--acx-accent-subtle);
    border-color: var(--acx-border);
  }
  .head-menu-toggle:active {
    background: var(--acx-accent-subtle);
    border-color: var(--acx-accent);
  }
  .head-menu-toggle:focus-visible {
    outline: var(--acx-border-width-strong) solid var(--acx-focus-ring);
    outline-offset: var(--acx-focus-offset);
  }
  .head-menu {
    position: absolute;
    z-index: 10;
    top: calc(100% + var(--acx-space-1));
    right: var(--acx-space-0);
    min-width: 160px;
    padding: var(--acx-space-2);
    border: var(--acx-border-width) solid var(--acx-border);
    border-radius: var(--acx-radius-md);
    background: var(--acx-surface-raised);
    box-shadow: var(--acx-shadow-2);
    animation: acx-menu-enter var(--acx-duration-fast) var(--acx-ease-standard);
  }
  @keyframes acx-menu-enter {
    from {
      opacity: 0;
      transform: translateY(calc(var(--acx-space-1) * -1));
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .head-menu[hidden] {
    display: none;
  }
  .head-menu .version-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--acx-space-2);
    padding: var(--acx-space-1) var(--acx-space-2) var(--acx-space-2);
    margin-bottom: var(--acx-space-1);
    border-bottom: var(--acx-border-width) solid var(--acx-border);
  }
  .head-menu .version-label {
    font: var(--acx-text-caption);
    color: var(--acx-text-muted);
  }
  .head-menu .version {
    font: var(--acx-text-mono-caption);
    color: var(--acx-text);
    background: var(--acx-surface-sunken);
    border: var(--acx-border-width) solid var(--acx-border);
    border-radius: var(--acx-radius-sm);
    padding: var(--acx-space-0) var(--acx-space-1);
    font-variant-numeric: tabular-nums;
  }
  .head-menu a {
    display: flex;
    align-items: center;
    gap: var(--acx-space-2);
    padding: var(--acx-space-2);
    color: var(--acx-accent);
    text-decoration: none;
    font: var(--acx-text-ui);
    border-radius: var(--acx-radius-sm);
    transition: background-color var(--acx-duration-fast) var(--acx-ease-standard);
  }
  .head-menu a:hover {
    background: var(--acx-accent-subtle);
  }
  .head-menu a:focus-visible {
    outline: var(--acx-border-width-strong) solid var(--acx-focus-ring);
    outline-offset: var(--acx-focus-offset);
    border-radius: var(--acx-radius-sm);
  }
  .head-menu a[hidden] {
    display: none;
  }

  .section {
    margin: var(--acx-space-4) var(--acx-space-1) var(--acx-space-2);
    font: var(--acx-text-caption);
    letter-spacing: var(--acx-tracking-overline);
    text-transform: uppercase;
    color: var(--acx-text-muted);
  }

  .panel {
    background: var(--acx-surface);
    border-radius: var(--acx-radius-lg);
    padding: var(--acx-space-0) var(--acx-space-4);
    border: var(--acx-border-width) solid var(--acx-border);
  }
  .row {
    display: flex;
    align-items: center;
    gap: var(--acx-space-3);
    min-height: var(--acx-control-h-md);
    padding: var(--acx-space-2) var(--acx-space-0);
    border-top: var(--acx-border-width) solid var(--acx-border);
  }
  .row:first-child {
    border-top: var(--acx-space-0);
  }
  .body {
    min-width: var(--acx-space-0);
  }
  .body .t {
    display: inline-flex;
    align-items: center;
    gap: var(--acx-space-2);
    font: var(--acx-text-ui);
    color: var(--acx-text);
  }
  .tag {
    display: inline-block;
    padding: var(--acx-space-0) var(--acx-space-1);
    border-radius: var(--acx-radius-sm);
    font: var(--acx-text-caption);
    color: var(--acx-text-muted);
    background: var(--acx-surface-sunken);
    border: var(--acx-border-width) solid var(--acx-border);
  }
  .tail {
    margin-left: auto;
    flex: none;
  }

  #open {
    width: 100%;
    height: var(--acx-control-h-md);
    border: var(--acx-border-width) solid var(--acx-accent);
    border-radius: var(--acx-radius-md);
    margin-top: var(--acx-space-3);
    padding: var(--acx-space-0) var(--acx-space-4);
    cursor: pointer;
    font: var(--acx-text-ui);
    color: var(--acx-text-on-accent);
    background: var(--acx-accent);
    transition:
      background-color var(--acx-duration-fast) var(--acx-ease-standard),
      border-color var(--acx-duration-fast) var(--acx-ease-standard),
      color var(--acx-duration-fast) var(--acx-ease-standard);
  }
  #open:active {
    background: var(--acx-accent-active);
    border-color: var(--acx-accent-active);
  }
  #open:focus-visible {
    outline: var(--acx-border-width-strong) solid var(--acx-focus-ring);
    outline-offset: var(--acx-focus-offset);
  }
  #open:disabled {
    background: var(--acx-surface-sunken);
    border-color: var(--acx-border);
    color: var(--acx-text-disabled);
    cursor: not-allowed;
  }

  .switch {
    position: relative;
    width: var(--acx-switch-w);
    height: var(--acx-switch-h);
    display: block;
    cursor: pointer;
  }
  .switch input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: var(--acx-space-0);
    cursor: pointer;
  }
  .switch .slider {
    position: absolute;
    inset: var(--acx-space-0);
    border-radius: var(--acx-radius-full);
    background: var(--acx-surface-sunken);
    border: var(--acx-border-width) solid var(--acx-border-strong);
    transition:
      background-color var(--acx-duration-fast) var(--acx-ease-standard),
      border-color var(--acx-duration-fast) var(--acx-ease-standard);
  }
  .switch .slider::before {
    content: "";
    position: absolute;
    top: calc(var(--acx-space-1) - var(--acx-border-width));
    left: calc(var(--acx-space-1) - var(--acx-border-width));
    width: var(--acx-switch-thumb);
    height: var(--acx-switch-thumb);
    border-radius: var(--acx-radius-full);
    background: var(--acx-text-muted);
    transition:
      transform var(--acx-duration-base) var(--acx-ease-standard),
      background-color var(--acx-duration-fast) var(--acx-ease-standard);
  }
  .switch input:checked + .slider {
    background: var(--acx-accent);
    border-color: var(--acx-accent);
  }
  .switch input:checked + .slider::before {
    transform: translateX(var(--acx-switch-shift));
    background: var(--acx-text-on-accent);
  }
  .switch input:focus-visible + .slider {
    outline: var(--acx-border-width-strong) solid var(--acx-focus-ring);
    outline-offset: var(--acx-focus-offset);
  }

  .shortcut-wrap {
    display: flex;
    align-items: center;
    gap: var(--acx-space-2);
  }
  .shortcut,
  .shortcut-clear {
    height: var(--acx-control-h-sm);
    border: var(--acx-border-width) solid var(--acx-border-strong);
    border-radius: var(--acx-radius-md);
    cursor: pointer;
    background: var(--acx-surface);
    color: var(--acx-text);
    padding: var(--acx-space-0) var(--acx-space-3);
    transition:
      background-color var(--acx-duration-fast) var(--acx-ease-standard),
      border-color var(--acx-duration-fast) var(--acx-ease-standard),
      color var(--acx-duration-fast) var(--acx-ease-standard);
  }
  .shortcut {
    font: var(--acx-text-mono-caption);
    font-variant-numeric: tabular-nums;
  }
  .shortcut-clear {
    font: var(--acx-text-caption);
    color: var(--acx-text-muted);
  }
  .shortcut:active,
  .shortcut-clear:active {
    background: var(--acx-accent-subtle);
  }
  .shortcut:focus-visible,
  .shortcut-clear:focus-visible {
    outline: var(--acx-border-width-strong) solid var(--acx-focus-ring);
    outline-offset: var(--acx-focus-offset);
  }
  .shortcut.is-listening {
    color: var(--acx-text-on-accent);
    background: var(--acx-accent);
    border-color: var(--acx-accent);
  }
  .shortcut:disabled,
  .shortcut-clear:disabled {
    cursor: not-allowed;
    background: var(--acx-surface-sunken);
    border-color: var(--acx-border);
    color: var(--acx-text-disabled);
  }

  .text-input {
    height: var(--acx-control-h-sm);
    max-width: var(--acx-input-max-w);
    border: var(--acx-border-width) solid var(--acx-border-strong);
    border-radius: var(--acx-radius-md);
    padding: var(--acx-space-0) var(--acx-space-2);
    font: var(--acx-text-small);
    color: var(--acx-text);
    background: var(--acx-surface);
    transition: border-color var(--acx-duration-fast) var(--acx-ease-standard);
  }
  .text-input::placeholder {
    color: var(--acx-text-subtle);
  }
  .text-input:focus-visible {
    border-color: var(--acx-accent);
    outline: var(--acx-border-width-strong) solid var(--acx-focus-ring);
    outline-offset: var(--acx-focus-offset);
  }

  @media (hover: hover) {
    #open:hover:not(:disabled) {
      background: var(--acx-accent-hover);
      border-color: var(--acx-accent-hover);
    }
    .shortcut:hover:not(:disabled),
    .shortcut-clear:hover:not(:disabled) {
      background: var(--acx-accent-subtle);
      color: var(--acx-text);
    }
    .text-input:hover {
      border-color: var(--acx-text-subtle);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    :root {
      --acx-duration-fast: 0.01ms;
      --acx-duration-base: 0.01ms;
    }
  }
</style>
</head>
<body>
<header class="head">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
        <path d="M6 6h10"></path>
        <path d="M6 10h10"></path>
      </svg>
    </span>
    <div class="brand-text">
      <span class="name">[unfold]</span>
      <span class="subtitle">IITM study tools</span>
    </div>
  </div>
  <div class="head-actions">
    <button id="headMenuToggle" class="head-menu-toggle" type="button"
      aria-label="More options" aria-controls="headMenu" aria-expanded="false" title="More options">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="2.5" cy="8" r="1.5" />
        <circle cx="8" cy="8" r="1.5" />
        <circle cx="13.5" cy="8" r="1.5" />
      </svg>
    </button>
    <div id="headMenu" class="head-menu" aria-label="More options" hidden>
      <div class="version-row">
        <span class="version-label">Version</span>
        <span class="version" role="status"><span id="ver"></span></span>
      </div>
      <a id="repo" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>

</header>

<div class="panel">
  <div class="row">
    <span class="body"><span class="t">Extension enabled</span></span>
    <label class="switch tail"><input type="checkbox" data-key="enabled" aria-label="Extension enabled" checked /><span class="slider"></span></label>
  </div>
</div>

<div class="section">Quiz Reader</div>
<div class="panel">
  <div class="row">
    <span class="body"><span class="t">Auto-show launcher</span></span>
    <label class="switch tail"><input type="checkbox" data-key="autoLauncher" aria-label="Auto-show launcher" checked /><span class="slider"></span></label>
  </div>
  <div class="row">
    <span class="body"><span class="t">Launcher position</span></span>
    <select data-key="launcherPos" aria-label="Launcher position" class="text-input tail">
      <option value="bottom-center">Bottom center</option>
      <option value="bottom-right">Bottom right</option>
      <option value="bottom-left">Bottom left</option>
      <option value="top-right">Top right</option>
      <option value="top-left">Top left</option>
    </select>
  </div>
  <div class="row">
    <span class="body"><span class="t">Theme</span></span>
    <select data-key="theme" aria-label="Reader theme" class="text-input tail">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>
  <div class="row">
    <span class="body"><span class="t">Compact cards</span></span>
    <label class="switch tail"><input type="checkbox" data-key="compact" aria-label="Compact cards" /><span class="slider"></span></label>
  </div>
  <div class="row">
    <span class="body"><span class="t">Keyboard shortcut</span></span>
    <label class="switch tail"><input id="shortcutEnabled" type="checkbox" data-key="openShortcutEnabled" aria-label="Enable keyboard shortcut" checked /><span class="slider"></span></label>
  </div>
  <div class="row">
    <span class="body"><span class="t">Shortcut keys</span></span>
    <span class="shortcut-wrap tail">
      <button id="shortcut" class="shortcut" type="button" aria-label="Shortcut keys">Alt+Q</button>
      <button id="shortcutClear" class="shortcut-clear" type="button" aria-label="Clear keyboard shortcut" title="Clear shortcut">Clear</button>
    </span>
  </div>
  <div class="row">
    <span class="body"><span class="t">Saved deadlines</span></span>
    <button id="clearDeadlines" class="shortcut-clear tail" type="button" aria-label="Clear saved deadlines" title="Clear saved deadlines">Clear</button>
  </div>
</div>

<button id="open" type="button" disabled>All Questions</button>

<div class="section">Portal Appearance</div>
<div class="panel">
  <div class="row">
    <span class="body"><span class="t">Portal font<span class="tag">Beta</span></span></span>
    <input id="fontName" class="text-input tail" type="text" data-key="fontName"
      aria-label="Portal font name"
      placeholder="System default" spellcheck="false" autocomplete="off"
      title="Type any font installed on your system, e.g. Satoshi Variable" />
  </div>
  <div class="row">
    <span class="body"><span class="t">Hide breadcrumbs</span></span>
    <label class="switch tail"><input type="checkbox" data-key="hideBreadcrumb" aria-label="Hide breadcrumbs" /><span class="slider"></span></label>
  </div>
  <div class="row">
    <span class="body"><span class="t">Hide info banners</span></span>
    <label class="switch tail"><input type="checkbox" data-key="hideBanner" aria-label="Hide info banners" /><span class="slider"></span></label>
  </div>
  <div class="row">
    <span class="body"><span class="t">Hide sidebar</span></span>
    <label class="switch tail"><input type="checkbox" data-key="hideSidebar" aria-label="Hide sidebar" /><span class="slider"></span></label>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
